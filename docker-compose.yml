version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: alchex-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=sqlserver://db:1433;database=alchex;user=sa;password=${DB_PASSWORD};encrypt=true;trustServerCertificate=true
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=http://localhost
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - alchex-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alchex-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - alchex-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alchex-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$DB_PASSWORD" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - alchex-net

volumes:
  sqlserver-data:

networks:
  alchex-net:
    driver: bridge
